[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloom-eval"
version = "0.1.0"
description = "Brand CI: regression and eval harness for Bloom Brand Skills (built on the public API only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "pillow>=10.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
# logo check (OpenCV) and copy check (Tesseract OCR; needs the `tesseract` binary)
vision = ["opencv-python-headless>=4.9", "pytesseract>=0.3.10"]
dev = ["pytest>=8"]

[project.scripts]
bloom-eval = "bloom_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
